<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia</title>
<link id="gf" rel="stylesheet" href="">
<style>
/* Template de lead — layout da Kassandra v3 (padrão aprovado). Tema por nicho vem de lead.js (cores/fontes derivadas de sites reais: _referencias/PADRAO-DERIVADO.md) */
:root{--bg:#F8F4EF;--alt:#F0E9E3;--surface:#fff;--text:#302621;--title:#302621;--accent:#D8B8A1;--on-accent:#302621;--dark:#302621;--on-dark:#F8F4EF;--star:#B89560;--line:rgba(0,0,0,.14);--display:'Lora',serif;--body:'Nunito Sans',sans-serif;--display-hero:var(--display);--label-font:var(--body);--dw:400;--r:2px;--br:2px;--btn-tt:uppercase}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-weight:400;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.w{max-width:1200px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--br);padding:16px 28px;font-family:var(--label-font);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:var(--btn-tt);transition:opacity .2s}
.btn:hover{opacity:.85}
.b1{background:var(--accent);color:var(--on-accent)}
.b2{border:1.5px solid var(--title);color:var(--title)}
header{background:var(--bg);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:84px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:var(--dw);font-size:22px;color:var(--title)}
.logo-img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff;flex:none}
.logo small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:3px}
nav{display:flex;gap:22px;font-family:var(--label-font);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;flex-wrap:nowrap;white-space:nowrap}
.burger{display:none;width:44px;height:44px;border:1.5px solid var(--title);border-radius:var(--br);place-items:center}
.burger i{display:block;width:18px;height:1.5px;background:var(--title);box-shadow:0 6px 0 var(--title),0 -6px 0 var(--title)}
.hero .w{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding-top:64px;padding-bottom:64px;position:relative;z-index:1}
.hero-dk{position:relative;overflow:hidden}
.hero-dk::before{content:"";position:absolute;top:-8%;left:50%;width:760px;height:760px;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 68%);pointer-events:none;z-index:0}
.hero-mark{position:absolute;top:0;left:50%;width:min(46vw,560px);max-width:none;height:auto;transform:translateX(-50%);opacity:.16;filter:brightness(0) invert(1);pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 78%);mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 78%)}
@media (max-width:820px){.hero-mark{width:min(88vw,460px)}}
/* entrada suave só no hero escuro, respeita quem prefere sem movimento */
@media (prefers-reduced-motion:no-preference){
  .hero-dk .rv-hero{animation:heroIn .8s cubic-bezier(.22,1,.36,1) both}
  .hero-dk .hero-mark{animation:markIn 1.4s cubic-bezier(.22,1,.36,1) both}
  @keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes markIn{from{opacity:0;transform:translateX(-50%) scale(.94)}to{opacity:.1;transform:translateX(-50%) scale(1)}}
}
.kick{font-family:var(--label-font);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-bottom:22px}
h1{font-family:var(--display-hero);font-weight:var(--dw);font-size:52px;line-height:1.14;color:var(--title);margin-bottom:24px}
.hero p.lead{font-size:18px;max-width:30em;margin-bottom:34px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .ph{aspect-ratio:4/5;background:var(--alt);overflow:hidden;border-radius:var(--r)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .cap{font-size:13px;opacity:.75;margin-top:10px}
.info{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info .w{display:grid;grid-template-columns:repeat(3,1fr)}
.info .c{padding:26px 28px;border-left:1px solid var(--line)}
.info .c:first-child{border-left:0;padding-left:0}
.info small{display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.info b{font-family:var(--display);font-weight:var(--dw);font-size:19px;color:var(--title)}
section{padding:96px 0 0}
.lab{font-family:var(--label-font);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:12px}
h2{font-family:var(--display);font-weight:var(--dw);font-size:36px;line-height:1.15;color:var(--title);margin-bottom:40px}
.svc{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:70px 1.1fr 1.4fr auto;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.row i{font-style:normal;font-family:var(--display);font-size:18px;opacity:.55}
.row h3{font-family:var(--display);font-weight:var(--dw);font-size:26px;color:var(--title)}
.row p{font-size:16px;opacity:.9}
.gal{display:grid;grid-template-columns:repeat(var(--gn,4),1fr);gap:16px}
.gal figure{aspect-ratio:3/4;overflow:hidden;background:var(--alt);border-radius:var(--r)}
.gal img{width:100%;height:100%;object-fit:cover}
.rev{background:var(--alt);margin-top:96px;padding:88px 0}
.rev h2{margin-bottom:12px}
.score{display:flex;align-items:baseline;gap:14px;margin-bottom:40px;font-size:16px}
.score b{font-family:var(--display);font-weight:var(--dw);font-size:44px;line-height:1;color:var(--title)}
.stars{letter-spacing:4px;color:var(--star)}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.q div{background:var(--surface);padding:32px 30px;border-radius:var(--r)}
.q q{display:block;font-family:var(--display);font-weight:var(--dw);font-size:20px;line-height:1.5;quotes:none;margin:12px 0 18px;color:var(--title)}
.q small{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
.ct{background:var(--dark);color:var(--on-dark);padding:96px 0;position:relative;overflow:hidden}
.fx-band{position:relative;overflow:hidden;background:radial-gradient(120% 100% at 18% 30%,color-mix(in srgb,var(--accent) 30%,#000) 0%,#000 68%);background-size:220% 220%}
.fx-band::after{content:"";position:absolute;top:0;left:0;right:0;height:220px;background:linear-gradient(to bottom,#000,transparent);pointer-events:none;z-index:0}
.fx-band>.w{position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){
  .fx-band{animation:gradFlow 18s ease-in-out infinite}
  @keyframes gradFlow{0%{background-position:0% 0%}50%{background-position:60% 40%}100%{background-position:0% 0%}}
  .hero-dk::before{animation:pulseGlow 7s ease-in-out infinite}
  @keyframes pulseGlow{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:.7;transform:translateX(-50%) scale(1.08)}}
}
.ct .w{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;position:relative;z-index:1}
.fx-gorilla{position:absolute;left:50%;top:0;transform:translateX(-50%);width:58%;height:100%;object-fit:cover;object-position:50% 0%;opacity:.2;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 14%,#000 78%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 14%,#000 78%,transparent 100%)}
@media (max-width:820px){.fx-gorilla{width:78%;object-position:50% 0%;opacity:.15}}
.ct h2{color:var(--on-dark);margin-bottom:18px}
.ct p{font-size:18px;opacity:.9;max-width:28em;margin-bottom:30px}
.ct .l{border-top:1px solid rgba(255,255,255,.28);padding:20px 0}
.ct .l small{display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.ct .l span{font-family:var(--display);font-weight:var(--dw);font-size:22px;line-height:1.35}
.ct .b1{background:var(--accent);color:var(--on-accent)}
footer{background:var(--dark);color:rgba(255,255,255,.72);font-size:12px;padding:22px 0}
.is-dark footer{border-top:1px solid rgba(255,255,255,.12)}
footer .w{display:flex;justify-content:space-between;gap:20px}
.wa{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:#25A55F;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:50}
.val-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}
.val-card{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:var(--surface)}
.val-card h3{font-family:var(--display);font-weight:var(--dw);font-size:19px;color:var(--accent);margin-bottom:10px}
.val-card p{font-size:15px;line-height:1.6}
.val-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.val-tags span{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px}
.val-regras{border-top:1px solid var(--line);padding-top:24px}
.val-regras h3{font-family:var(--display);font-weight:var(--dw);font-size:19px;margin-bottom:14px}
.val-regras ol{columns:2;column-gap:40px;font-size:15px;line-height:1.9;padding-left:20px}
.val-regras li{break-inside:avoid}
.pilar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}
.pilar-card{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:38px 26px 30px;background:var(--surface);overflow:hidden;text-align:center;isolation:isolate}
.pilar-card::before{content:attr(data-n);position:absolute;top:-10px;right:8px;font-family:var(--display);font-weight:800;font-size:68px;line-height:1;color:var(--alt);z-index:0}
.pilar-card b{position:relative;display:block;font-family:var(--display);font-weight:var(--dw);font-size:23px;color:var(--title);letter-spacing:.01em}
.pilar-card span{position:relative;display:block;width:34px;height:3px;background:var(--accent);margin:16px auto 0;border-radius:2px}
.belt-row{display:flex;align-items:flex-start;gap:0;position:relative;padding-top:4px}
.belt-row::before{content:"";position:absolute;top:19px;left:0;right:0;height:1px;background:var(--line);z-index:0}
.belt-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;padding:0 8px;min-width:0}
.belt-n{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--label-font);font-weight:700;font-size:12px;color:var(--accent)}
.belt-bar{width:100%;max-width:110px;height:24px;border-radius:5px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.2)}
.is-dark .belt-bar{border-color:rgba(255,255,255,.14)}
.belt-bar::after{content:"";position:absolute;right:-1px;top:-1px;bottom:-1px;width:30%;background:#0a0a0a;border-radius:0 5px 5px 0;border:1px solid rgba(0,0,0,.2)}
.is-dark .belt-bar::after{border-color:rgba(255,255,255,.14)}
.belt-it.final .belt-n{color:var(--accent);border-color:var(--accent)}
.belt-it.final .belt-bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent),0 8px 20px rgba(0,0,0,.4)}
.belt-it small{font-family:var(--label-font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
@media (max-width:820px){.belt-row{gap:0}.belt-it{padding:0 3px}.belt-bar{max-width:70px;height:19px}.belt-n{width:30px;height:30px;font-size:10px}.belt-row::before{top:15px}}
@media (max-width:820px){.val-grid{grid-template-columns:1fr}.pilar-grid{grid-template-columns:1fr}.val-regras ol{columns:1}}
.placa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.placa-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:32px 26px;text-align:center;display:flex;flex-direction:column}
.placa-card.destaque{align-items:center;justify-content:center}
.placa-logo{width:58px;height:58px;border-radius:50%;object-fit:cover;margin:0 auto 18px;display:block;border:1px solid var(--line);background:#fff;flex:none}
.placa-h{font-family:var(--display);font-weight:var(--dw);color:var(--accent);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.placa-card p{font-size:13.5px;line-height:1.75}
.placa-card ol,.placa-card ul{list-style:none;font-size:13px;line-height:1.85;text-align:left}
.placa-block+.placa-block{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.placa-card.destaque .placa-h{font-size:20px;margin-bottom:16px}
.placa-card.destaque b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:19px;color:var(--title)}
@media (max-width:820px){.placa-grid{grid-template-columns:1fr}}
.mestres-ph{border-radius:var(--r);overflow:hidden;max-width:640px;margin:0 auto}
.mestres-ph img{width:100%;display:block}
.mestres-cap{margin-top:18px;font-size:14px;color:var(--text);opacity:.85;max-width:40em}
.mvv-banner{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:48px;aspect-ratio:100/23}
.mvv-banner img{width:100%;height:100%;object-fit:cover;display:block}
.mvv-row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:56px}
.mvv-col{border-top:2px solid var(--accent);padding-top:18px}
.mvv-col h3{font-family:var(--display);font-weight:var(--dw);font-size:19px;color:var(--title);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.mvv-col h3 svg{color:var(--accent);flex:none}
.mvv-col p{font-size:15px;line-height:1.75}
.mvv-vlab{text-align:center;font-family:var(--display);font-weight:var(--dw);font-size:22px;color:var(--title);margin-bottom:28px}
.mvv-vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px 12px;margin-bottom:56px}
.mvv-v{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mvv-v .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.mvv-v small{font-family:var(--label-font);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.mvv-pilares{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:56px}
.mvv-pc{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;isolation:isolate}
.mvv-pc img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:0}
.mvv-pc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.15) 60%);z-index:1}
.mvv-pc .tx{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
.mvv-pc b{font-family:var(--display);font-weight:var(--dw);font-size:21px;text-transform:uppercase}
.mvv-pc span{font-size:12.5px;opacity:.85;margin-top:6px;display:block;max-width:22em}
.mvv-regras{display:grid;grid-template-columns:70px 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mvv-regras .side{background:var(--dark);color:var(--on-dark);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--display);font-size:20px;letter-spacing:.1em;padding:20px 0}
.mvv-regras .body{padding:30px 34px}
.mvv-regras h3{font-family:var(--display);font-weight:var(--dw);font-size:19px;margin-bottom:16px}
.mvv-regras ol{columns:2;column-gap:40px;font-size:14.5px;line-height:2;padding-left:20px}
.mvv-regras li{break-inside:avoid}
@media (max-width:820px){.mvv-row{grid-template-columns:1fr;gap:28px}.mvv-vgrid{grid-template-columns:repeat(3,1fr)}.mvv-pilares{grid-template-columns:1fr}.mvv-regras{grid-template-columns:1fr}.mvv-regras .side{writing-mode:horizontal-tb;padding:12px}.mvv-regras ol{columns:1}}
.team-org{display:flex;flex-direction:column;align-items:center;width:100%;padding-top:8px}
.team-level{display:flex;flex-direction:column;align-items:center;position:relative}
.team-level+.team-level{margin-top:40px}
.team-level+.team-level::before{content:"";position:absolute;top:-40px;left:50%;width:1px;height:40px;background:var(--line);transform:translateX(-50%)}
.team-tier-lab{font-family:var(--label-font);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:14px}
.team-tier{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.team-node{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:184px;flex:0 0 auto;text-align:center}
.team-node.head{border-color:var(--accent)}
.team-node.ghost{border-style:dashed;opacity:.5}
.team-ini{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}
.team-node.ghost .team-ini{background:transparent;border:1px dashed var(--line);color:var(--text)}
.team-node b{font-family:var(--display);font-weight:var(--dw);font-size:16px;color:var(--title)}
.team-node small{font-family:var(--label-font);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.68;line-height:1.5}
.team-node em{font-style:normal;display:block;font-family:var(--label-font);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.45;margin-top:2px}
.ct-map{margin-top:26px;border-radius:var(--r);overflow:hidden;border:1px solid rgba(255,255,255,.18);aspect-ratio:16/10;background:rgba(255,255,255,.06)}
.ct-map iframe{width:100%;height:100%;border:0}
.about-card{display:grid;grid-template-columns:260px 1fr;gap:44px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:36px;background:var(--surface)}
.about-ph{border-radius:var(--r);overflow:hidden;background:var(--alt)}
.about-ph img{width:100%;height:100%;display:block}
.about-card b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:24px;color:var(--title);margin-bottom:4px}
.about-card .cargo{font-family:var(--label-font);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.about-card p{font-size:15px;line-height:1.75}
@media (max-width:820px){.about-card{grid-template-columns:1fr;padding:24px;gap:22px}}
@media (max-width:820px){
  .w{padding:0 22px}
  nav,header .btn{display:none}.burger{display:grid}
  header .w{height:72px}.logo{font-size:19px}
  .hero .w{grid-template-columns:1fr;gap:28px;padding-top:28px;padding-bottom:40px}
  h1{font-size:38px}.hero p.lead{font-size:16px;margin-bottom:24px}
  .ctas .btn{flex:1 1 100%}
  .hero .ph{aspect-ratio:4/4.4}.hero .w>div:last-child{order:-1}
  .kick{font-size:11px;letter-spacing:.14em}
  .info .w{grid-template-columns:1fr}.info .c{border-left:0;border-top:1px solid var(--line);padding:18px 0}.info .c:first-child{border-top:0}
  section{padding:64px 0 0}h2{font-size:30px;margin-bottom:28px}
  .row{grid-template-columns:36px 1fr;gap:6px 14px;padding:22px 0}.row p{grid-column:2}.row .btn{grid-column:2;justify-self:start;margin-top:10px}
  .gal{grid-template-columns:1fr 1fr;gap:10px}.gal figure:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:4/3}
  .rev{margin-top:64px;padding:60px 0}.q{grid-template-columns:1fr}
  .ct{padding:64px 0}.ct .w{grid-template-columns:1fr;gap:34px}
  footer .w{flex-direction:column}
  .team-tier{gap:10px}
  .team-node{width:calc(50% - 5px);padding:16px 10px}
  .team-ini{width:40px;height:40px;font-size:15px}
  .team-node b{font-size:14px}
}
</style>
</head>

<script src="app.js"></script>
